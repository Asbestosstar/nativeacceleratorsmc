# Native Accelerator configuration
#
# Copy this file to config/nativeaccelerator.properties to override defaults.
# System properties (-Dnativeaccelerator.<key>=value) take precedence.

# Reuse parsed model JSON only when resource packs contain sufficient identical model files.
# Disabled by code default because content-key construction can cost more than the saved parsing.
model.parseCache=true
model.parseCache.maxEntries=32768

# Batch model and blockstate resource preparation instead of creating one future per resource.
# This reduces executor/future overhead while keeping batches parallel.
model.batchLoading=true
# Set either explicit size to a positive value to override adaptive sizing; 0 uses adaptive sizing.
model.batchSize=0
model.blockstate.batchSize=0
# Adaptive sizing targets this many worker tasks per available processor.
model.tasksPerWorker=4
# Adaptive batches remain within these inclusive limits.
model.minBatchSize=16
model.maxBatchSize=128

# Emit aggregate model-pipeline timings after a successful ModelManager reload.
model.profiler=true
