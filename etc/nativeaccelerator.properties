# Native Accelerator configuration
# This file is optional. These are the built-in defaults shown explicitly so that
# any enhancement can be disabled locally. Restart Minecraft after editing.
# JVM -Dnativeaccelerator.<key>=<value> overrides this file.

# Reuse parsed, unchanged block/item model JSON across F3+T resource reloads.
# Proven benefit in the current benchmark: 58.2% less ModelManager preparation time.
model.parseCache=true
# Maximum cached distinct model JSON documents; cache clears as a whole at this limit.
model.parseCache.maxEntries=32768

# Use native SimpleBitStorage unpacking when available and above its measured crossover.
# Set minElements to a very large value to effectively disable native bit storage.
bits.minElements=2048

# Vulkan renderer policy: auto uses runtime hardware/backend evidence; off selects the
# standard Minecraft renderer; on forces the Native Accelerator client renderer.
renderer.vulkan=auto
# Native renderer worker count; 0 lets the implementation select it.
renderer.workers=0

# Lightweight startup-stage timing report. Disable if timing output is not wanted.
startup.timing=true
# Write the current run as a startup baseline (diagnostic, normally false).
startup.record=false

# Per-resource-listener reload profiling is diagnostic overhead, not an acceleration.
# It deliberately remains off by default; enable it only when investigating reloads.
reload.profile=false

# Advanced JVM-only emergency controls (not read from this file):
# -Dnativeaccelerator.mixins=false
# -Dnativeaccelerator.mixins.disable=SimpleBitStorageMixin
