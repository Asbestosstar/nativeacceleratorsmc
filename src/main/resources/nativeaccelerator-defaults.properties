# Native Accelerator complete default configuration.
# "auto" means retain the runtime/detected default where supported.

# Core / mixins
mixins=true
mixins.disable=
mixins.environment=auto
mixins.loaders=auto
mixins.renderer=auto
process.allowRerun=false

# CPU topology overrides (auto = detected value)
cpu.packages=auto
cpu.physicalCores=auto
cpu.logicalProcessors=auto
cpu.nominalClockMHz=auto
cpu.maxClockMHz=auto

# Native kernels
bits.minElements=auto
noise.minCells=auto
noise.mode=stack
dax.mode=auto
dax.allowEmulation=false
dax.minElements=auto
dax.jar.minElements=auto
dax.maxConcurrent=32
dax.debug=false

# General renderer / backend
renderer.backend=inherit
renderer.vulkan=auto
renderer.workers=0
renderer.platform.role=auto
renderer.minecraft.options=
renderer.minecraft.gamedir=

# Metal renderer
renderer.metal=auto
renderer.metal.allowMacFamily1=auto
renderer.metal.forceAttempt=false
renderer.metal.forceCpuIndirect=false
renderer.metal.mac1Validation=false
renderer.metal.framesInFlight=3
renderer.metal.mac1FramesInFlight=1
renderer.metal.mac1CycleClearedTargets=false
renderer.metal.mac1StrictSwapchainPresent=false
renderer.metal.mac1WaitForSwapchain=true
renderer.metal.mac1ForcePresentedSourceFirstClear=true
renderer.metal.mac1SerializeBufferUploads=true
renderer.metal.generatedTextureYFlip=true
renderer.metal.fanMaxVertices=65536
renderer.metal.benchmark=true
renderer.metal.benchmarkFrames=120
renderer.metal.benchmarkFile=

# Graphics-menu presentation
graphics.unixTheme=true
graphics.crt.scanlines=true
graphics.crt.uma=true
graphics.crt.umaOpacity=100
graphics.crt.umaScale=100
graphics.crt.green=120
graphics.crt.panelAlpha=242

# GUI / atlas / textures
gui.fixButtonNineSliceSeam=true
atlas.fastStitcher=true
atlas.safeFastStitcher=true
atlas.verifyFastStitcher=false
atlas.parallelMipmaps=true
atlas.batchSpriteSuppliers=true
atlas.dedicatedPool=true
atlas.workers=0
atlas.workerPriority=2
atlas.dynamicChunkSize=2
atlas.mipmapChunksPerWorker=2
atlas.mipmapSerialPixels=393216
atlas.mipmapSerialSprites=24

# Persistent caches
cache.enabled=true
cache.allowDevelopment=false
cache.directory=
cache.hashDirectoryContents=false
cache.maxEntryBytes=67108864
cache.decodedTextures=true
cache.atlasLayout=true
cache.atlasLayout.requireVerified=true
cache.resourceBytes=false
cache.resourceBytes.learn=true
cache.resourceBytes.textures=false
cache.resourceBytes.maxLearnBytes=4194304
cache.deferredWrites=true
cache.deferredWrites.maxPendingTasks=16384
cache.deferredWrites.maxPendingMiB=96

# Resource/model loading
resource.index=true
resource.zipIndex=true
resource.pathManifest=true
resource.pathManifest.defaultFs=false
model.batchLoading=true
model.batchItemLoading=true
model.fastGroups=true
model.fastBlockstateJson=true
model.fastCuboidJson=true
model.fastItemJson=true
model.verifyFastPaths=false
model.logFallbacks=false
model.parseCache=false
model.parseCache.maxEntries=auto
model.profiler=false
model.dagProfiler=false
model.ioProfiler=false
model.resourceOpenProfiler=false
model.dedicatedPool=true
model.workers=0
model.dynamicChunkSize=2
model.forkJoinGrain=0
model.forkJoinLeavesPerWorker=8
reload.profile=false

# Startup timing
startup.timing=true
startup.record=false
startup.report=
startup.baseline=

# World generation
worldgen.fastFill=true
worldgen.fastLighting=true
worldgen.fastSurface=false
worldgen.fastSurfaceRules=true
worldgen.profile=false
worldgen.deepProfile=false
worldgen.cpuProfiler=false
worldgen.deepProfileSampleRate=256
worldgen.profileReportEvery=256
worldgen.smtScheduler=auto
worldgen.smt.strandsPerCore=0
worldgen.smt.reserveCores=auto
worldgen.smt.bind=true
worldgen.smt.pinServerThread=true

# Native cache locations
nativeCache.packDirectory=
nativeCache.userDirectory=

# Legacy/advanced renderer override (auto leaves renderer.backend/options.txt in control)
graphicsApi=auto

# Per-family fork/join overrides (0 = use the global/automatic value)
model.forkJoinGrain.default=0
model.forkJoinGrain.rawModel=0
model.forkJoinGrain.blockstate=0
model.forkJoinGrain.item=0
model.forkJoinGrain.atlas=0
model.forkJoinLeavesPerWorker.default=8
model.forkJoinLeavesPerWorker.rawModel=8
model.forkJoinLeavesPerWorker.blockstate=8
model.forkJoinLeavesPerWorker.item=8
model.forkJoinLeavesPerWorker.atlas=8
# Metal GUI parity diagnostics / correctness paths
renderer.metal.guiRegionalClearUpload=true
renderer.metal.resetSamplersPerPipeline=true
renderer.metal.forceRenderAreaScissor=true
renderer.metal.explicitViewportPerPass=true


# Extremely verbose asynchronous Metal renderer diagnostics (fix48)
renderer.metal.trace=true
renderer.metal.traceConsole=false
renderer.metal.traceQueueSize=262144

# fix50: Mac1 createFence follows RenderPearl/Vulkan semantics and no longer submits/splits the frame.

# Mac1 residual GUI correctness after Vulkan-style fence semantics
renderer.metal.mac1RetainTextureTransfers=true
renderer.metal.mac1RegionalDepthAttachmentClear=true
renderer.metal.mac1RelaxImplicitPassScissor=true
